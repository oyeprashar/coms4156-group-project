name: Tests, coverage, and static analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '26']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Run tests, coverage check, Checkstyle, and SpotBugs
        run: ./gradlew --no-daemon --console=plain --continue check

      - name: Upload test, coverage, Checkstyle, and SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-java-${{ matrix.java }}
          path: build/reports/
          if-no-files-found: ignore
